<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoodResQ - Sell Food</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">FoodResQ</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="donate.html">Donate Food</a></li>
      <li><a href="view.html">View Donations</a></li>
      <li><a href="sell.html" class="active">Sell Food</a></li>
      <li><a href="view-sell.html">View Sales</a></li>
    </ul>
  </header>

  <!-- Hero Section -->
  <section class="hero" style="background-image: url('https://images.unsplash.com/photo-1598514982301-4d9b9f92e37c?auto=format&fit=crop&w=1470&q=80');">
    <div class="hero-content">
      <h1>Sell Extra Food!</h1>
      <p>Let others benefit from food you can sell instead of wasting it.</p>
    </div>
  </section>

  <!-- Sell Form -->
  <main class="form-section container">
    <form id="sellForm">
      <label>Food Type:</label>
      <input type="text" id="sellFoodType" placeholder="e.g., Vegetables, Bread" required>

      <label>Quantity (No. of people or kg):</label>
      <input type="number" id="sellQuantity" placeholder="e.g., 50" required>

      <label>Location:</label>
      <input type="text" id="sellLocation" placeholder="City/Street" required>

      <label>Contact Number:</label>
      <input type="tel" id="sellContact" placeholder="e.g., +91 9876543210" required>

      <label>Expiry Date:</label>
      <input type="date" id="sellExpiry" required>

      <label>Price (optional):</label>
      <input type="number" id="sellPrice" placeholder="Enter price per unit">

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 FoodResQ. All rights reserved.fgfdgdfgfdgfdgfdggfdddddddddddggggggggggggffffff</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Handle Sell Form Submission
    let sells = JSON.parse(localStorage.getItem("sells")) || [];

    document.getElementById("sellForm").addEventListener("submit", function(e){
      e.preventDefault();
      const sellItem = {
        foodType: document.getElementById("sellFoodType").value,
        quantity: document.getElementById("sellQuantity").value,
        location: document.getElementById("sellLocation").value,
        contact: document.getElementById("sellContact").value,
        expiry: document.getElementById("sellExpiry").value,
        price: document.getElementById("sellPrice").value,
        image: "https://images.unsplash.com/photo-1598514982301-4d9b9f92e37c?auto=format&fit=crop&w=600&q=80"
      };
      sells.push(sellItem);
      localStorage.setItem("sells", JSON.stringify(sells));
      alert("Food listed for sale successfully!");
      this.reset();
    });
  </script>
</body>
</html>
